name: Deploy backend to Hugging Face

# Pushes the api/ folder to the Hugging Face Docker Space that serves the API.
# Requires a repository secret HF_TOKEN (a Hugging Face write token).
# Optional repository variable HF_SPACE (default: Texmexdex/Local-Emergency-Alerts).

on:
  push:
    branches: [main]
    paths: ["api/**"]
  workflow_dispatch:

concurrency: deploy-backend

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_SPACE: ${{ vars.HF_SPACE || 'Texmexdex/Local-Emergency-Alerts' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test before deploying
        run: |
          pip install -r api/requirements.txt pytest
          pytest -q api/tests
      - name: Push api/ to the Space
        if: env.HF_TOKEN != ''
        working-directory: api
        run: |
          git init -q -b main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7} from GitHub"
          git push --force "https://hf-user:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" main
      - name: Skipped (no HF_TOKEN secret)
        if: env.HF_TOKEN == ''
        run: echo "::notice::Set the HF_TOKEN repository secret to enable automatic backend deploys."
