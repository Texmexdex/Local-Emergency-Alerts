plugins {
    id 'com.android.application'
}

android {
    namespace 'org.localemergencyalerts.relay'
    compileSdk 35

    defaultConfig {
        applicationId 'org.localemergencyalerts.relay'
        minSdk 24
        targetSdk 35
        versionCode 2
        versionName '2.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
