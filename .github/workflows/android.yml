name: Android relay app

# Builds the CAER Relay Android app (android/). Every run uploads the APK as a
# workflow artifact; runs on main also publish it as the "caer-relay" release,
# so it can be downloaded straight to a phone from a fixed link.

on:
  push:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Build APK
        run: gradle -p android assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: caer-relay-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish download link (main only)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk caer-relay.apk
          gh release delete caer-relay --yes --cleanup-tag || true
          gh release create caer-relay caer-relay.apk \
            --title "CAER Relay (Android)" \
            --notes "Forwards EHCMA CAER Online notifications to the Local Emergency Alerts Worker. Built from ${GITHUB_SHA::7}. Setup: DEPLOYMENT.md step 4." \
            --target "$GITHUB_SHA"
