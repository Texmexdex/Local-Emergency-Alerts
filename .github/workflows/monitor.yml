name: Emergency monitor (phone push)

# Every 10 minutes, checks for emergencies near your location and sends new
# ones to your phone via ntfy (https://ntfy.sh). Does nothing until you add a
# repository secret NTFY_TOPIC. Configure location with repository variables:
#   HOME_LAT, HOME_LON, HOME_LABEL, RADIUS_MI (default 10),
#   NOTIFY_MIN_LEVEL (action | warning | advisory; default warning),
#   DASHBOARD_URL (opened when you tap a notification).
#
# Note: GitHub runs scheduled workflows on a best-effort basis (delays of
# several minutes are common) and pauses them after 60 days without repository
# activity. Treat this as a backup to official alerts, not a replacement.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency: monitor

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      NTFY_SERVER: ${{ vars.NTFY_SERVER || 'https://ntfy.sh' }}
      HOME_LAT: ${{ vars.HOME_LAT || '29.7761' }}
      HOME_LON: ${{ vars.HOME_LON || '-95.1144' }}
      HOME_LABEL: ${{ vars.HOME_LABEL || 'Channelview, TX' }}
      RADIUS_MI: ${{ vars.RADIUS_MI || '10' }}
      NOTIFY_MIN_LEVEL: ${{ vars.NOTIFY_MIN_LEVEL || 'warning' }}
      DASHBOARD_URL: ${{ vars.DASHBOARD_URL || 'https://texmexdex.github.io/Local-Emergency-Alerts/' }}
      STATE_FILE: .monitor-state/state.json
    steps:
      - name: Skipped (no NTFY_TOPIC secret)
        if: env.NTFY_TOPIC == ''
        run: echo "::notice::Set the NTFY_TOPIC repository secret to enable phone notifications."
      - uses: actions/checkout@v4
        if: env.NTFY_TOPIC != ''
      - uses: actions/setup-python@v5
        if: env.NTFY_TOPIC != ''
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements.txt
      - name: Restore what was already sent
        if: env.NTFY_TOPIC != ''
        uses: actions/cache@v4
        with:
          path: api/.monitor-state
          key: monitor-state-${{ github.run_id }}
          restore-keys: monitor-state-
      - name: Check and notify
        if: env.NTFY_TOPIC != ''
        working-directory: api
        run: |
          pip install -q -r requirements.txt
          python -m emergency.monitor --lat "$HOME_LAT" --lon "$HOME_LON"
